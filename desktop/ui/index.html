<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Codex 额度查询</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="m9 9 7 7-7 7m11 0h6"/></svg></div><div><h1>Codex 额度查询</h1><p>额度与重置卡</p></div></div>
      <button id="refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></svg><span>刷新额度</span></button>
    </header>
    <div class="account"><strong id="email">正在读取账号…</strong><span class="badge" id="plan" hidden></span><span class="updated" id="updated">查询中</span></div>
    <div id="error" class="message error" role="alert" hidden></div>
    <div id="notice" class="message" role="status" hidden></div>
    <section class="windows" aria-label="额度窗口">
      <article class="quota-card" id="primary"><h2>5 小时窗口</h2><div class="numbers"><div><strong class="percent">—</strong><span class="remaining">剩余</span></div><span class="used">等待查询</span></div><div class="bar" role="progressbar" aria-label="5 小时窗口剩余额度" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="reset-row"><span class="reset">重置时间待查询</span><span class="countdown">—</span></div></article>
      <article class="quota-card" id="secondary"><h2>每周窗口</h2><div class="numbers"><div><strong class="percent">—</strong><span class="remaining">剩余</span></div><span class="used">等待查询</span></div><div class="bar" role="progressbar" aria-label="每周窗口剩余额度" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="reset-row"><span class="reset">重置时间待查询</span><span class="countdown">—</span></div></article>
    </section>
    <section class="credits" aria-labelledby="credits-title"><div class="section-title"><h2 id="credits-title">重置卡</h2><span class="badge" id="card-count">等待查询</span></div><p class="hint">按到期时间排序</p><div id="cards"><div class="empty">正在获取可用重置卡…</div></div></section>
    <footer><span>重置卡使用请前往官方用量页</span><button class="small" id="open-usage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7-11 11M10 3H3v18h18v-7"/></svg>打开官方用量页</button></footer>
    <div class="privacy"><span class="status-dot"></span><span id="status">数据仅在本机显示</span></div>
  </main>
  <template id="card-template"><article class="ticket"><div class="ticket-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4V5Zm9 1v2m0 3v2m0 3v2"/></svg></div><div class="ticket-name"><strong></strong><span>重置卡</span></div><span class="expiry"></span><span class="ticket-countdown"></span></article></template>
</body>
</html>
