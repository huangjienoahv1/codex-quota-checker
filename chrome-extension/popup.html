<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    :root { color-scheme: dark; }
    body {
      width: 340px;
      margin: 0;
      padding: 14px 16px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #e8eaed;
      background: #1e1f22;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    header h1 { font-size: 15px; margin: 0; }
    #refresh {
      background: #35373b;
      color: #e8eaed;
      border: 1px solid #5f6368;
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    #refresh:hover { background: #444746; }
    #refresh:disabled { opacity: 0.6; cursor: wait; }
    .settings { margin-bottom: 12px; color: #9aa0a6; font-size: 12px; }
    .settings summary { cursor: pointer; color: #e8eaed; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    #refresh-interval { background: #35373b; color: #e8eaed; border: 1px solid #5f6368; border-radius: 4px; padding: 3px; }
    #settings-status { margin-top: 6px; line-height: 1.5; }
    .account-row { margin-bottom: 10px; }
    #account { width: 100%; margin-top: 4px; background: #35373b; color: #e8eaed; border: 1px solid #5f6368; border-radius: 4px; padding: 4px; }
    .status { color: #9aa0a6; padding: 8px 0; }
    .error {
      color: #f28b82;
      background: #2d2223;
      border: 1px solid #5c2b29;
      border-radius: 6px;
      padding: 8px 10px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .headline {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2px;
    }
    .plan { color: #8ab4f8; font-weight: 600; font-size: 14px; }
    #summary { font-weight: 600; }
    .meta2 {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #9aa0a6;
      font-size: 11px;
      margin-bottom: 10px;
    }
    #email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .warn { color: #fdd663; margin: 0 0 8px; }
    .window { margin-bottom: 12px; }
    .window .row1 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .used { color: #9aa0a6; font-size: 11px; margin-left: 6px; }
    .bar {
      height: 8px;
      background: #35373b;
      border-radius: 4px;
      overflow: hidden;
    }
    /* 进度条以「剩余」为口径：条越长剩余越多，与官方界面一致 */
    .fill { height: 100%; border-radius: 4px; background: #81c995; }
    .fill.mid { background: #fdd663; }
    .fill.high { background: #f28b82; }
    .reset { color: #9aa0a6; font-size: 12px; margin-top: 4px; }
    .extra { color: #9aa0a6; font-size: 12px; margin-top: 8px; }
    .credits {
      border-top: 1px solid #35373b;
      margin-top: 10px;
      padding-top: 8px;
      font-size: 12px;
    }
    .credits .credits-error { color: #f28b82; }
    .credits ul { list-style: none; margin: 6px 0 0; padding: 0; }
    .credits details { padding: 3px 0; }
    .credits summary {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      list-style: none;
      cursor: pointer;
    }
    .credits summary::-webkit-details-marker { display: none; }
    .credits summary::after { content: "▸"; color: #9aa0a6; }
    .credits details[open] summary::after { content: "▾"; }
    .card-title { color: #e8eaed; }
    .card-empty { color: #9aa0a6; }
    .card-expiry { color: #9aa0a6; white-space: nowrap; }
    .card-expiry.soon { color: #f28b82; }
    .card-body {
      color: #9aa0a6;
      font-size: 11px;
      line-height: 1.5;
      padding: 4px 0 6px;
    }
    .purchase { margin-top: 8px; font-size: 12px; }
    .purchase a { color: #8ab4f8; text-decoration: none; }
    .footer {
      margin-top: 12px;
      border-top: 1px solid #35373b;
      padding-top: 8px;
      font-size: 12px;
    }
    .footer a { color: #8ab4f8; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Codex 额度查询</h1>
    <button id="refresh">刷新</button>
  </header>

  <div id="account-row" class="account-row" hidden>
    <label for="account">查询账户</label>
    <select id="account" aria-label="选择要查询的账户"></select>
  </div>

  <details class="settings">
    <summary>刷新设置</summary>
    <label class="settings-row"><span>后台自动刷新额度</span><input id="auto-refresh" type="checkbox" disabled></label>
    <label class="settings-row" for="refresh-interval"><span>刷新间隔</span><select id="refresh-interval" disabled></select></label>
    <div id="settings-status" role="status" aria-live="polite">正在读取设置…</div>
  </details>

  <div id="status" class="status">查询中…</div>

  <div id="content" hidden>
    <div class="headline">
      <span class="plan" id="plan"></span>
      <span id="summary"></span>
    </div>
    <div class="meta2">
      <span id="email"></span>
      <span id="updated"></span>
    </div>
    <div id="limit-warn" class="warn" hidden>⚠ 当前限额已用尽</div>
    <div id="spend-warn" class="warn" hidden>⚠ 已达到消费上限（spend control）</div>

    <section class="window">
      <div class="row1">
        <span>5 小时窗口</span>
        <span><span id="pct-primary"></span><span class="used" id="used-primary"></span></span>
      </div>
      <div class="bar"><div id="fill-primary" class="fill"></div></div>
      <div class="reset" id="reset-primary"></div>
    </section>

    <section class="window">
      <div class="row1">
        <span>每周窗口</span>
        <span><span id="pct-secondary"></span><span class="used" id="used-secondary"></span></span>
      </div>
      <div class="bar"><div id="fill-secondary" class="fill"></div></div>
      <div class="reset" id="reset-secondary"></div>
    </section>

    <section class="window" id="section-cr" hidden>
      <div class="row1">
        <span>Code review 配额</span>
        <span><span id="pct-cr"></span><span class="used" id="used-cr"></span></span>
      </div>
      <div class="bar"><div id="fill-cr" class="fill"></div></div>
      <div class="reset" id="reset-cr"></div>
    </section>

    <div class="extra" id="models" hidden></div>
    <div class="extra" id="credits-balance" hidden></div>

    <div class="credits" id="credits" hidden>
      <div id="credits-title"></div>
      <ul id="cards"></ul>
      <div class="purchase" id="purchase" hidden></div>
    </div>

    <div class="footer">
      <a href="https://chatgpt.com/codex/cloud/settings/analytics#usage" target="_blank" rel="noreferrer">打开官方用量页 ↗</a>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
